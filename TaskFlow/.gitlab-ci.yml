stages:
  - build
  - test

variables:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

backend_build:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:8.0

  script:
    - dotnet restore backend/TaskFlow.sln
    - dotnet build backend/TaskFlow.sln --no-restore

backend_test:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:8.0

  script:
    - dotnet test backend/TaskFlow.sln
